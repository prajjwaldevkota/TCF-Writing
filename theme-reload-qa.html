<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated theme and random selection QA</title></head><body><div id="root"></div><script>
let randomCalls=0;const random= Math.random;Math.random=()=>{randomCalls++;return random();};const draws=[];
document.addEventListener('click',event=>{if(event.target.closest('.random-combination-button')){const before=randomCalls;setTimeout(()=>draws.push({calls:randomCalls-before,selection:document.querySelector('[data-combination-id]')?.dataset.combinationId,started:!!localStorage.getItem('tcf_practice_session_v2')}),0);}},true);
setInterval(()=>{let draft;try{draft=JSON.parse(localStorage.getItem('tcf_practice_session_v2')||'null');}catch{}const editor=document.querySelector('.writing-desk>textarea');const style=editor?getComputedStyle(editor):null;const rect=editor?.getBoundingClientRect();let out=document.getElementById('qa-check');if(!out){out=document.createElement('output');out.id='qa-check';out.hidden=true;document.body.appendChild(out);}out.textContent=JSON.stringify({theme:document.documentElement.dataset.theme,draws,selection:document.querySelector('[data-combination-id]')?.dataset.combinationId,topicCards:document.querySelectorAll('.topic-card').length,draftId:draft?.id,combinationNumber:draft?.combination.combinationNumber,hasAllSources:!!draft?.combination.tasks.task3.document1&&!!draft?.combination.tasks.task3.document2,viewport:innerWidth,pageWidth:document.documentElement.scrollWidth,editor:style?{width:Math.round(rect.width),height:Math.round(rect.height),fontSize:style.fontSize,color:style.color,background:style.backgroundColor}:null});},100);
</script><script type="module" src="/src/main.tsx"></script></body></html>
